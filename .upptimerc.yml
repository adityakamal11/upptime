# Upptime configuration for adityakamal.com
# Drop this file in the root of your Upptime repo, replacing the template's version.
# Docs: https://upptime.js.org/docs/configuration

owner: adityakamal11
repo: upptime

sites:
  - name: Portfolio
    url: https://adityakamal.com
    # Down if the page STOPS containing this text — catches the case where
    # nginx is up and returns 200 but the app behind it is broken.
    # (Note: `__dangerous__body_down` means the opposite — down if PRESENT.)
    __dangerous__body_down_if_text_missing: Aditya Kamal

  - name: Portfolio API
    url: https://adityakamal.com/api/health
    # Liveness probe: proves the Node process itself is answering, not just nginx.
    __dangerous__body_down_if_text_missing: '"status":"ok"'

  - name: Preview (/test)
    url: https://adityakamal.com/test

  - name: WWW redirect
    url: https://www.adityakamal.com

status-website:
  cname: # optional: set to status.adityakamal.com if you add a CNAME record
  logoUrl: https://adityakamal.com/profile.jpg
  name: Aditya Kamal — Status
  introTitle: "**Status** — adityakamal.com"
  introMessage: Uptime and response time for the services I run on AWS, checked every 5 minutes from GitHub Actions.
  navbar:
    - title: Status
      href: /
    - title: Portfolio
      href: https://adityakamal.com

# How often things run (GitHub Actions cron). Defaults are fine and stay well
# inside the free minutes allowance for a public repo.
workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *"

i18n:
  activeIncidents: Active incidents
  allSystemsOperational: All systems operational
  incidentReport: "Incident #$NUMBER report"
  liveStatus: Live status
  overallUptime: "Overall uptime: $UPTIME"
  pastIncidents: Past incidents
  responseTime: Response time
  up: Up
  down: Down
